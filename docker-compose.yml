services:

  # ========================================================
  # MYSQL
  # ========================================================

  mysql:
    image: mysql:8.0
    container_name: jobboard_mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    expose:
      - "3306"

    ports:
      - "127.0.0.1:3306:3306"

    networks:
      - backend-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  # ========================================================
  # PHPMYADMIN
  # ========================================================

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: jobboard_phpmyadmin
    restart: unless-stopped

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306

    ports:
      - "8081:80"

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - backend-network


  # ========================================================
  # EXPRESS APP
  # ========================================================

  app:
    build:
      context: ./app
      dockerfile: Dockerfile

    container_name: jobboard_app
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      APP_PORT: 3000

    expose:
      - "3000"

    volumes:
      - ./app/uploads:/app/uploads

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - frontend-network
      - backend-network


  # ========================================================
  # NGINX
  # ========================================================

  nginx:
    image: nginx:alpine
    container_name: jobboard_nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro

    depends_on:
      - app

    networks:
      - frontend-network


  # ========================================================
  # PROMETHEUS
  # ========================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: jobboard_prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

    networks:
      - monitoring-network


  # ========================================================
  # GRAFANA
  # ========================================================

  grafana:
    image: grafana/grafana:latest
    container_name: jobboard_grafana
    restart: unless-stopped

    ports:
      - "3001:3000"

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}

    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro

    depends_on:
      - prometheus

    networks:
      - monitoring-network


  # ========================================================
  # NODE EXPORTER
  # ========================================================

  node-exporter:
    image: prom/node-exporter:latest
    container_name: jobboard_node_exporter
    restart: unless-stopped

    pid: host

    command:
      - "--path.rootfs=/host"

    volumes:
      - "/:/host:ro,rslave"

    networks:
      - monitoring-network


  # ========================================================
  # CADVISOR
  # ========================================================

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: jobboard_cadvisor
    restart: unless-stopped

    privileged: true

    volumes:
      - "/:/rootfs:ro"
      - "/var/run:/var/run:ro"
      - "/sys:/sys:ro"
      - "/var/lib/docker:/var/lib/docker:ro"

    networks:
      - monitoring-network


  # ========================================================
  # BLACKBOX EXPORTER
  # ========================================================

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: jobboard_blackbox
    restart: unless-stopped

    volumes:
      - ./prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro

    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"

    networks:
      - monitoring-network
      - frontend-network
      - backend-network


# ==========================================================
# VOLUMES
# ==========================================================

volumes:

  mysql_data:

  prometheus_data:

  grafana_data:


# ==========================================================
# NETWORKS
# ==========================================================

networks:

  frontend-network:
    driver: bridge

  backend-network:
    driver: bridge

  monitoring-network:
    driver: bridge
