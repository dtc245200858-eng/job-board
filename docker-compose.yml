services:

  # ========================================================
  # MYSQL
  # ========================================================

  mysql:
    image: mysql:8.0
    container_name: jobboard_mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    expose:
      - "3306"

    ports:
      - "127.0.0.1:3306:3306"

    networks:
      - backend-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  # ========================================================
  # PHPMYADMIN
  # ========================================================

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: jobboard_phpmyadmin
    restart: unless-stopped

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306

    ports:
      - "8081:80"

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - backend-network


  # ========================================================
  # EXPRESS APP
  # ========================================================

  app:
    build:
      context: ./app
      dockerfile: Dockerfile

    container_name: jobboard_app
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      APP_PORT: 3000

    expose:
      - "3000"

    volumes:
      - ./app/uploads:/app/uploads

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - frontend-network
      - backend-network


  # ========================================================
  # NGINX REVERSE PROXY
  # ========================================================

  nginx:
    image: nginx:alpine
    container_name: jobboard_nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro

    depends_on:
      - app

    networks:
      - frontend-network


# ==========================================================
# VOLUMES
# ==========================================================

volumes:
  mysql_data:


# ==========================================================
# NETWORKS
# ==========================================================

networks:

  frontend-network:
    driver: bridge

  backend-network:
    driver: bridge
