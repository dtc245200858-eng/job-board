# ==========================================================
# HTTP -> HTTPS
# ==========================================================

server {

    listen 80;

    server_name
        192.168.146.128
        localhost;

    return 301
        https://$host$request_uri;
}


# ==========================================================
# HTTPS - JOB BOARD
# ==========================================================

server {

    listen 443 ssl;

    server_name
        192.168.146.128
        localhost;


    # ------------------------------------------------------
    # SSL
    # ------------------------------------------------------

    ssl_certificate
        /etc/nginx/ssl/jobboard.crt;

    ssl_certificate_key
        /etc/nginx/ssl/jobboard.key;

    ssl_protocols
        TLSv1.2
        TLSv1.3;


    # ------------------------------------------------------
    # UPLOAD CV
    # ------------------------------------------------------

    client_max_body_size 10M;


    # ------------------------------------------------------
    # SECURITY HEADERS
    # ------------------------------------------------------

    add_header
        X-Frame-Options
        "DENY"
        always;

    add_header
        X-Content-Type-Options
        "nosniff"
        always;

    add_header
        Referrer-Policy
        "strict-origin-when-cross-origin"
        always;

    add_header
        Permissions-Policy
        "camera=(), microphone=(), geolocation=()"
        always;


    # ------------------------------------------------------
    # REVERSE PROXY TO EXPRESS
    # ------------------------------------------------------

    location / {

        proxy_pass
            http://app:3000;

        proxy_http_version
            1.1;

        proxy_set_header
            Host
            $host;

        proxy_set_header
            X-Real-IP
            $remote_addr;

        proxy_set_header
            X-Forwarded-For
            $proxy_add_x_forwarded_for;

        proxy_set_header
            X-Forwarded-Proto
            $scheme;

        proxy_set_header
            X-Forwarded-Host
            $host;

        proxy_connect_timeout
            30s;

        proxy_send_timeout
            60s;

        proxy_read_timeout
            60s;
    }
}
