<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Job Board - Website Tuyển Dụng
    </title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>


<body>

<header>

    <div class="container header-content">

        <h1>JOB BOARD</h1>
<nav>

    <a href="/">
        Trang chủ
    </a>

    <a href="#jobs">
        Việc làm
    </a>

    <div id="auth-menu">

        <a href="/login.html">
            Đăng nhập
        </a>

        <a href="/register.html">
            Đăng ký
        </a>

    </div>

</nav>




    </div>

</header>


<section class="hero">
 <!-- Hình trang trí -->
    <div class="hero-decoration decoration-1">✨</div>
    <div class="hero-decoration decoration-2">💼</div>
    <div class="hero-decoration decoration-3">🚀</div>
    <div class="hero-decoration decoration-4">⭐</div>
    <div class="hero-badge">
	 ✨ Nền tảng tuyển dụng dành cho bạn
    </div>

    <h2>
        Tìm công việc
        <span class="hero-highlight">
            trong mơ
        </span>
        của bạn
    </h2>

    <p>
        Khám phá những cơ hội nghề nghiệp hấp dẫn
        và bắt đầu hành trình mới ngay hôm nay.
    </p>
     <!-- GIỮ NGUYÊN search-box CỦA BẠN Ở DƯỚI -->


    <div class="search-box">

        <input
            id="search-input"
            type="text"
            placeholder="🔍 Tìm công việc, công ty, địa điểm..."
        >

        <button id="search-button">
            Tìm kiếm
        </button>

    </div>

</section>


<main
    id="jobs"
    class="jobs-section"
>

    <div class="container">

        <h2>
            Việc làm mới nhất
        </h2>


        <div
            id="job-list"
            class="job-list"
        >

            <p>
                Đang tải việc làm...
            </p>

        </div>

    </div>

</main>


<footer>

    Website Tuyển Dụng - Job Board

</footer>


<script src="/js/app.js"></script>

</body>

</html>
