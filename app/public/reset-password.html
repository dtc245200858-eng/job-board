<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Đặt lại mật khẩu - Job Board
    </title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>


<body>

<header>

    <div class="container header-content">

        <h1>
            JOB BOARD
        </h1>

        <nav>

            <a href="/">
                🏠 Trang chủ
            </a>

        </nav>

    </div>

</header>


<main class="auth-page">

    <div class="auth-box">

        <div class="password-page-icon">
            🔑
        </div>


        <h2>
            Tạo mật khẩu mới
        </h2>


        <p class="password-help-text">

            Nhập mật khẩu mới cho tài khoản của bạn.

            Mật khẩu phải có ít nhất 8 ký tự.

        </p>


        <form id="reset-password-form">

            <label for="new-password">
                Mật khẩu mới
            </label>

            <input
                id="new-password"
                type="password"
                minlength="8"
                placeholder="🔐 Nhập mật khẩu mới"
                required
            >


            <label for="confirm-password">
                Xác nhận mật khẩu
            </label>

            <input
                id="confirm-password"
                type="password"
                minlength="8"
                placeholder="🔐 Nhập lại mật khẩu mới"
                required
            >


            <button type="submit">
                🌈 Đặt lại mật khẩu
            </button>

        </form>


        <p
            id="reset-message"
            class="auth-message"
        ></p>


        <div class="auth-bottom-link">

            <a href="/login.html">
                ← Quay lại đăng nhập
            </a>

        </div>

    </div>

</main>


<footer>
    ✨ Website Tuyển Dụng - Job Board
</footer>


<script src="/js/reset-password.js"></script>

</body>

</html>
