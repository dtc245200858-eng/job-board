<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Quên mật khẩu - Job Board
    </title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>


<body>

<header>

    <div class="container header-content">

        <h1>
            JOB BOARD
        </h1>

        <nav>

            <a href="/">
                🏠 Trang chủ
            </a>

        </nav>

    </div>

</header>


<main class="auth-page">

    <div class="auth-box">

        <div class="password-page-icon">
            🔐
        </div>

        <h2>
            Quên mật khẩu?
        </h2>


        <p class="password-help-text">

            Nhập email đã đăng ký.
            Hệ thống sẽ gửi liên kết
            đặt lại mật khẩu.

        </p>


        <form id="forgot-password-form">

            <label for="email">
                Email
            </label>

            <input
                id="email"
                type="email"
                placeholder="📧 Nhập email của bạn"
                required
            >


            <button type="submit">
                ✨ Gửi liên kết khôi phục
            </button>

        </form>


        <p
            id="forgot-message"
            class="auth-message"
        ></p>


        <div class="auth-bottom-link">

            <a href="/login.html">
                ← Quay lại đăng nhập
            </a>

        </div>

    </div>

</main>


<footer>
    ✨ Website Tuyển Dụng - Job Board
</footer>


<script src="/js/forgot-password.js"></script>

</body>

</html>
