global:
  scrape_interval: 15s
  evaluation_interval: 15s


scrape_configs:

  # ========================================================
  # PROMETHEUS
  # ========================================================

  - job_name: prometheus

    static_configs:
      - targets:
          - prometheus:9090


  # ========================================================
  # HOST UBUNTU
  # ========================================================

  - job_name: node-exporter

    static_configs:
      - targets:
          - node-exporter:9100


  # ========================================================
  # DOCKER CONTAINERS
  # ========================================================

  - job_name: cadvisor

    static_configs:
      - targets:
          - cadvisor:8080


  # ========================================================
  # WEBSITE HTTPS
  # ========================================================

  - job_name: blackbox-web

    metrics_path: /probe

    params:
      module:
        - http_2xx

    static_configs:
      - targets:
          - https://nginx

    relabel_configs:

      - source_labels:
          - __address__
        target_label: __param_target

      - source_labels:
          - __param_target
        target_label: instance

      - target_label: __address__
        replacement: blackbox-exporter:9115


  # ========================================================
  # MYSQL AVAILABILITY
  # ========================================================

  - job_name: blackbox-mysql

    metrics_path: /probe

    params:
      module:
        - tcp_connect

    static_configs:
      - targets:
          - mysql:3306

    relabel_configs:

      - source_labels:
          - __address__
        target_label: __param_target

      - source_labels:
          - __param_target
        target_label: instance

      - target_label: __address__
        replacement: blackbox-exporter:9115
